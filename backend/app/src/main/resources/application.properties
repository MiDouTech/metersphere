spring.application.name=metersphere
spring.cloud.compatibility-verifier.enabled=false
# LOCAL 账密登录开关，默认 true；false 时仅 admin 保留运维登录（环境变量：MS_LOCAL_LOGIN_ENABLED）
# metersphere.local-login.enabled=true

# AI Runner Secret Provider。ENV 默认关闭且仅建议用于受控非生产部署。
agent.secret.env-enabled=${MS_AGENT_SECRET_ENV_ENABLED:false}
# Vault KV v2 默认关闭；Token 只从 token-env 指定的进程环境变量读取，不进入配置文件。
agent.secret.vault.enabled=${MS_AGENT_SECRET_VAULT_ENABLED:false}
agent.secret.vault.address=${MS_AGENT_SECRET_VAULT_ADDRESS:}
agent.secret.vault.token-env=${MS_AGENT_SECRET_VAULT_TOKEN_ENV:MS_VAULT_TOKEN}
agent.secret.vault.namespace=${MS_AGENT_SECRET_VAULT_NAMESPACE:}

# AI 双通道执行配置；全部可用同名 MS_AI_* 环境变量覆盖。非法范围会在启动阶段拒绝启动。
metersphere.ai.map-gateway.base-url=${MS_AI_MAP_GATEWAY_BASE_URL:}
metersphere.ai.map-gateway.connect-timeout-ms=${MS_AI_MAP_GATEWAY_CONNECT_TIMEOUT_MS:3000}
metersphere.ai.map-gateway.request-timeout-ms=${MS_AI_MAP_GATEWAY_REQUEST_TIMEOUT_MS:60000}
metersphere.ai.execution.preflight-ttl-ms=${MS_AI_PREFLIGHT_TTL_MS:600000}
agent.execution.trigger-scan-ms=${MS_AI_TRIGGER_SCAN_MS:30000}
agent.execution.runner-heartbeat-ms=${MS_AI_RUNNER_HEARTBEAT_MS:30000}
agent.execution.lease-ttl-ms=${MS_AI_LEASE_TTL_MS:60000}
agent.execution.reconcile-scan-ms=${MS_AI_RECONCILE_SCAN_MS:60000}
agent.execution.artifact-max-bytes=${MS_AI_ARTIFACT_MAX_BYTES:5242880}
agent.execution.artifact-retention-ms=${MS_AI_ARTIFACT_RETENTION_MS:2592000000}
agent.execution.data-cleanup-max-attempts=${MS_AI_DATA_CLEANUP_MAX_ATTEMPTS:5}
agent.execution.data-cleanup-scan-ms=${MS_AI_DATA_CLEANUP_SCAN_MS:30000}
agent.execution.data-lease-reclaim-ms=${MS_AI_DATA_LEASE_RECLAIM_MS:30000}
agent.execution.alert-scan-ms=${MS_AI_ALERT_SCAN_MS:60000}
