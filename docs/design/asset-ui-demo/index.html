<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>资产优化 Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#30313d;font:14px "Microsoft YaHei"}header{background:white;padding:22px 30px;border-bottom:1px solid #eee;display:flex;gap:24px;align-items:center}strong{color:#803994;font-size:20px}button,input,select{font:inherit;padding:9px 14px;border:1px solid #dedee8;border-radius:5px;background:white}button{cursor:pointer}button:hover{color:#803994;border-color:#803994}.primary{background:#803994;color:white}main{padding:30px}h1{font-size:23px}p,small{color:#86909c}.card{background:white;border:1px solid #e9e9f0;border-radius:8px;padding:22px;margin-top:20px}.tools{display:flex;gap:12px;align-items:center;margin-bottom:24px}.space{flex:1}.operations,.retrieval{display:flex;gap:12px;align-items:center}.retrieval{margin-left:auto}.tools{flex-wrap:wrap}@media(max-width:900px){.retrieval{flex-wrap:wrap;justify-content:flex-end;width:100%}}table{width:100%;border-collapse:collapse;text-align:left}th{background:#f7f8fa;color:#657080;font-weight:500}th,td{padding:19px 14px;border-bottom:1px solid #eee}.tag{color:#803994;background:#f3eaf7;padding:4px 9px;border-radius:4px}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}.tree div{padding:15px}.selected{color:#803994;background:#f5ebf8}.notice{padding:14px;background:#f7f0fa;color:#79508a;margin-bottom:20px;border-radius:5px}dialog{width:730px;max-width:95vw;max-height:90vh;overflow:auto;border:0;padding:26px;border-radius:10px;box-shadow:0 20px 70px #2224}dialog:modal{overscroll-behavior:contain}dialog::backdrop{background:#20233266;overflow:hidden;overscroll-behavior:contain}label{display:block;margin:18px 0}label input,label select{display:block;width:100%;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.row{display:flex;gap:8px;margin:12px 0}.row input{min-width:0;flex:1}.foot{text-align:right;border-top:1px solid #eee;padding-top:20px}.close{float:right}.muted{color:#86909c}td button{border:0;color:#803994}button:focus-visible{outline:2px solid #803994}
</style><header><strong>⬡ 测试资产云平台</strong><button onclick="page('业务资产')">业务资产</button><span class="muted">用例资产　　测试数据</span><button onclick="page('公共配置')">公共配置</button><button onclick="page('资产版本')">资产版本</button><small>交互原型 · 虚构示例数据</small></header><main id="main"></main>
<dialog id="edit" aria-labelledby="title"><button class="close" onclick="edit.close()" aria-label="关闭">✕</button><h2 id="title">新增公共配置</h2><form id="f"><label>配置名称 *<input required autofocus placeholder="例如：测试品牌商登录账号"></label><div class="grid"><label>所属系统 *<select><option>米多大数据引擎</option><option>经销助手</option></select></label><label>所属环境 *<select><option>测试环境</option><option>灰度环境</option></select></label></div><label>配置类型<select id="kind" onchange="fields()"><option>敏感配置</option><option>普通配置</option><option>配置文档</option></select></label><div id="fields"></div><p>仅演示交互，请勿填写真实凭证。关闭后清空，不持久化。</p><div class="foot"><button type="button" onclick="edit.close()">取消</button> <button class="primary">保存配置</button></div></form></dialog>
<dialog id="detail" aria-labelledby="dt"><button class="close" onclick="detail.close()">关闭</button><h2 id="dt">版本详情</h2><div class="notice">历史快照不可修改；敏感配置值始终不展示。</div><p>示例用户 · 2026-11-20 10:30</p><h3>变更摘要</h3><p>更新业务规则或配置内容，保留版本与来源记录。</p></dialog><script>
function table(h,r){return '<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function page(p){let config=p==='公共配置',version=p==='资产版本';main.innerHTML='<h1>'+p+'</h1><p>'+ (config?'按系统和环境管理配置，敏感内容按权限使用。':version?'追溯资产变化，统一管理当前版本与历史快照。':'沉淀业务理解，按系统、模块和业务流程组织资产。')+ '</p><div class="tools"><div class="operations">'+(!version?'<button onclick="alert(\'Demo：正式版使用系统上传组件并校验文件\')">↑ '+(config?'批量导入':'上传文档')+'</button><button class="primary" onclick="'+(config?'openEdit()':'alert(\'本轮 Demo 聚焦页面布局与配置表单\')')+'">＋ '+(config?'新增配置':'新建业务理解')+'</button>':'')+'<button onclick="alert(\'Demo：示例数据已刷新\')">刷新</button></div><div class="retrieval"><input aria-label="搜索" placeholder="搜索名称" oninput="filter(this.value)"><select aria-label="筛选"><option>全部系统</option></select><select aria-label="环境或状态"><option>'+ (config?'全部环境':'全部状态')+'</option></select></div></div>';
let a='<button onclick="detail.showModal()">查看</button> <button onclick="detail.showModal()">版本</button>';
if(config)main.innerHTML+='<section class="card">'+table(['配置名称','系统 / 环境','类型','版本','状态','操作'],[['测试品牌商登录账号','米多大数据引擎 / 测试环境','<span class="tag">账号密码</span>','V2','可用','<button onclick="openEdit()">编辑</button>'+a],['外部服务凭证','经销助手 / 测试环境','<span class="tag">其他敏感</span>','V1','可用',a],['平台入口地址','米多大数据引擎 / 测试环境','普通配置','V3','可用',a]])+'</section>';
else if(version)main.innerHTML+='<section class="card"><div class="tools"><button onclick="versions(false)">业务资产</button><button onclick="versions(true)">公共配置</button></div><div class="notice">版本切换仅影响后续任务，执行中任务继续使用已固定版本。历史敏感值不展示。</div><div id="versions"></div></section>';
else main.innerHTML+='<p>8 份业务文档　 ·　42 个操作分支　 ·　2 项待确认</p><div class="layout"><aside class="card tree"><h3>业务分类</h3><div class="selected">全部业务　8</div><div>⌄ 米多大数据引擎　5</div><div>　订单管理　3</div><div>　会员管理　2</div><div>经销助手　2</div><div>待归类　1</div></aside><section class="card">'+table(['业务理解 / 系统','模块 / 流程','分支','版本','状态','操作'],[['订单创建与提交业务理解<br><small>米多大数据引擎</small>','订单管理 / 创建订单','12','V3','<span class="tag">已确认</span>',a],['会员注册与身份校验','会员管理 / 注册流程','8','V2','<span class="tag">待确认</span>',a]])+'</section></div>';if(version)versions(false)}
function versions(s){document.getElementById('versions').innerHTML=table(['资产名称','版本','状态','变更摘要','更新人 / 时间','操作'],[[s?'测试品牌商登录账号':'订单创建与提交业务理解','V3','当前版本',s?'更新凭证（值不可见）':'补充库存不足规则','示例用户 / 2026-11-20','<button onclick="detail.showModal()">查看</button>'],[s?'测试品牌商登录账号':'订单创建与提交业务理解','V2','历史版本','首次创建','示例用户 / 2026-11-19','<button onclick="alert(\'Demo：正式版填写原因并二次确认，当前不修改版本\')">设为当前</button>']])}
function filter(q){document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.includes(q))}
function openEdit(){f.reset();fields();edit.showModal()}function fields(){document.getElementById('fields').innerHTML=kind.value==='敏感配置'?'<label>敏感配置分类<select id="sub" onchange="secret()"><option>账号密码</option><option>其他</option></select></label><div id="secret"></div>':kind.value==='普通配置'?'<label>配置内容 *<input required></label>':'<label>配置文档 *<input required type="file"></label>';if(kind.value==='敏感配置')secret()}
function secret(){document.getElementById('secret').innerHTML=(sub.value==='账号密码'?'<div class="grid"><label>账号 *<input required autocomplete="off"></label><label>密码 *<input required type="password" autocomplete="new-password"></label></div>':'')+'<div id="rows"></div><button type="button" onclick="add()">＋ 添加自定义字段</button>';if(sub.value==='其他')add()}
function add(){let r=document.createElement('div');r.className='row';r.innerHTML='<input required aria-label="字段名称" placeholder="字段名称，如 Token"><input required aria-label="敏感值" type="password" autocomplete="new-password" placeholder="敏感值"><button type="button" onclick="this.parentElement.remove()">移除</button>';rows.append(r)}
f.onsubmit=e=>{e.preventDefault();edit.close();alert('演示保存成功，未调用后端、未持久化')};edit.addEventListener('close',()=>{f.reset();document.getElementById('fields').replaceChildren()});page('业务资产');
</script></html>
