<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSP · 用例与计划设计评审</title>
<style>
:root{--p:#783c91;--pale:#f3edf8;--ink:#242638;--muted:#7c8194;--line:#e9eaf1}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:var(--ink);font:14px/1.6 'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:7px 13px;background:white;color:var(--ink)}button:hover{border-color:var(--p);color:var(--p)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c9a5df;outline-offset:2px}.primary{background:var(--p);color:white!important;border-color:var(--p)}.quiet{background:none;border:0}.danger{color:#c64750}input,select{padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:white;min-width:0}input[type=checkbox]{accent-color:var(--p);width:16px;height:16px;cursor:pointer}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:white}.brand{font-size:19px;font-weight:700;color:var(--p)}.muted{color:var(--muted);font-size:12px}.shell{display:flex;min-height:calc(100vh - 66px)}nav{width:184px;flex-shrink:0;padding:24px 14px;background:white;border-right:1px solid var(--line)}nav button{width:100%;text-align:left;margin-bottom:8px;padding:11px 15px;border:0;color:#666d80}nav button.active{background:var(--pale);color:var(--p);font-weight:bold}nav .caption{padding:14px 15px;font-size:11px;color:var(--muted);letter-spacing:2px}main{padding:26px;flex:1;min-width:0}.crumb{font-size:12px;color:var(--muted);margin-bottom:14px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}h1{margin:0;font-size:25px;letter-spacing:-.5px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.workspace{display:flex;min-height:520px}.folders{width:210px;flex-shrink:0;padding:20px 14px;border-right:1px solid var(--line)}.folders button{width:100%;text-align:left;border:0;margin-bottom:6px}.folders button.chosen{color:var(--p);background:var(--pale)}.content{flex:1;min-width:0;padding:20px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filters input{flex:1;min-width:160px}.summary{display:flex;gap:30px;padding:18px 22px;border-bottom:1px solid var(--line)}.summary strong{font-size:22px;margin-right:8px}.badge{display:inline-block;border-radius:5px;padding:2px 8px;background:#f1f2f6;color:#62687b;font-size:12px}.ok{background:#e9f7ef;color:#26804f}.warn{background:#fff5df;color:#a67513}.bad{background:#ffedf0;color:#bd455c}.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--pale);border-radius:7px;margin-bottom:14px}.bulk strong{color:var(--p);margin-right:8px}.scroll{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:860px;text-align:left;white-space:nowrap}th{background:#fafbfe;color:#7c8194;font-size:12px;font-weight:500}th,td{padding:14px 12px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fcfaff}td.name{min-width:260px;max-width:340px;white-space:normal}td.name button{text-align:left;padding:0;border:0;background:none;font-weight:500}td:last-child,th:last-child{position:sticky;right:0;background:white;box-shadow:-7px 0 10px -10px #777}th:last-child{background:#fafbfe}.tag{font-size:11px;color:#7c6688;background:#f5f1f8;border-radius:4px;padding:2px 6px;margin-right:4px}.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:17px;color:var(--muted);font-size:12px}.notice{padding:12px 16px;margin-bottom:18px;border:1px solid #f2dca5;border-radius:8px;background:#fffaf0;display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:6px;background:#edf0f5;border-radius:5px;margin-top:7px;overflow:hidden}.progress span{height:100%;display:block;background:#53ac85}.plan-top{padding:20px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:center}.tabs{display:flex;gap:12px;border-bottom:1px solid var(--line);margin:14px 0}.tabs button{border:0;border-radius:0;padding:9px 12px}.tabs button.active{color:var(--p);border-bottom:2px solid var(--p)}.overlay{position:fixed;inset:0;background:#20233555;display:none;z-index:9;justify-content:flex-end}.overlay.open{display:flex}.drawer{width:560px;max-width:95vw;background:white;height:100%;padding:26px;overflow:auto;box-shadow:-10px 0 40px #20233515}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.fact{border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}.fact p{margin:6px 0}.modal{width:460px;max-width:94vw;background:white;border-radius:12px;padding:25px;margin:auto}.field{display:grid;gap:6px;margin:14px 0}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#303044;color:white;border-radius:8px;z-index:15;display:none}.empty{padding:70px 10px;text-align:center;color:var(--muted)}.prototype{background:#fff7df;color:#8e6a22;padding:3px 9px;border-radius:5px;font-size:11px}.tip{border-left:3px solid #b28bc5;padding:8px 12px;background:#faf7fc;color:#74617e;font-size:12px}.collapse{display:none}@media(max-width:1280px){nav{width:148px}main{padding:20px}.folders{width:180px}.content{padding:16px}.summary{gap:18px}}@media(max-width:1000px){.folders{display:none}.collapse{display:block}.heading{align-items:flex-start}header .muted{display:none}}@media(max-width:700px){nav{width:110px;padding:15px 5px}nav button{padding:10px}main{padding:12px}.heading{flex-direction:column}.summary{gap:12px;flex-wrap:wrap}.plan-top{flex-wrap:wrap}header{padding:12px}.brand{font-size:15px}}
</style>
<header><div class="brand">⬡ 测试资产云平台 <span class="prototype">设计评审 Demo</span></div><div class="muted">示例数据 · 未连接真实接口　 /　米多公司　　陈启芬</div></header>
<div class="shell"><nav><div class="caption">测试管理</div><button data-view="case" class="active">▤　测试用例</button><button data-view="plan">◫　测试计划</button><button data-view="asset">▧　测试资产</button><div class="caption" style="margin-top:50px">评审重点</div><p class="muted" style="padding:0 15px">布局与层级<br>批量操作<br>刷新与执行事实</p></nav><main id="app"></main></div>
<div class="overlay" id="detail"><section class="drawer"><div class="drawer-head"><span class="muted">用例详情 · 示例</span><button onclick="closeOverlays()" aria-label="关闭详情">✕</button></div><div id="detailBody"></div></section></div>
<div class="overlay" id="dialog"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="drawer-head"><h2 id="dialogTitle"></h2><button onclick="closeOverlays()" aria-label="关闭对话框">✕</button></div><div id="dialogBody"></div><div class="actions" style="justify-content:flex-end;margin-top:22px"><button onclick="closeOverlays()">取消</button><button class="primary" id="confirm">确认</button></div></section></div><div class="toast" role="status" id="toast"></div>
<script>
const seed=[['100005','订单创建成功后展示最新状态','P0','成功',['订单','核心路径'],2,4,'订单中心'],['100006','未登录用户访问订单详情','P1','失败',['权限'],1,2,'权限校验'],['100007','库存不足时阻止提交订单','P0','未执行',['库存'],0,0,'订单中心'],['100008','重复提交订单保持幂等','P1','成功',['订单'],0,3,'订单中心'],['100009','取消订单后释放占用库存','P2','未执行',['库存'],0,0,'订单中心'],['100010','不同角色查看所属订单','P1','成功',['权限'],0,1,'权限校验']];
let rows=seed.map((r,i)=>({id:r[0],name:r[1],level:r[2],status:r[3],tags:r[4],bugs:r[5],files:r[6],category:r[7],ref:i===0?2:0}));let view='case',selected=new Set(),query='',status='',folder='全部用例',focusReturn;const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const filtered=()=>rows.filter(r=>(!query||`${r.id}${r.name}${r.tags.join('')}`.includes(query))&&(!status||r.status===status)&&(folder==='全部用例'||r.category===folder));
function notify(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',3200)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected.clear();query='';status='';folder='全部用例';render()});
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const asset=view==='asset',plan=view==='plan';app.innerHTML=`<div class="crumb">${asset?'测试资产 / 用例资产':plan?'测试管理 / 测试计划 / 计划详情':'测试管理 / 测试用例'}</div><div class="heading"><div><h1>${asset?'用例资产':plan?'订单核心链路回归':'测试用例'}</h1><div class="muted">${asset?'统一沉淀可复用用例，保留来源与引用关系':plan?'TP-100001　 ·　负责人 陈启芬　 ·　最近同步：刚刚':'MSP 需求验收项目　 /　'+rows.length+' 条用例'}</div></div><div class="actions"><button onclick="exportRows()">↓ 导出示例</button><button class="primary" onclick="notify('原型仅演示布局；新建沿用现有业务表单')">${asset?'＋ 新建用例资产':plan?'＋ 关联用例':'＋ 新建用例'}</button></div></div>${asset?`<div class="notice"><div><strong>历史同步：部分成功</strong><div class="muted">成功 5 项 · 跳过 1 项 · 失败 2 项，已同步用例 576 条</div></div><button onclick="failure()">查看失败原因 →</button></div>`:''}<section class="panel">${plan?`<div class="plan-top"><div style="flex:1"><span class="badge warn">进行中</span><h2 style="margin:8px 0 0">执行进度　4 / 6</h2><div class="progress"><span style="width:66.7%"></span></div></div><div><strong style="font-size:24px">75%</strong><div class="muted">已执行通过率</div></div><button id="refresh" onclick="refreshPlan()">↻ 获取最新数据</button></div>`:`<div class="summary"><div><strong>${rows.length}</strong><span class="muted">${asset?'可复用资产':'全部用例'}</span></div><div><strong>2</strong><span class="muted">P0 核心用例</span></div><div><strong>3</strong><span class="muted">${asset?'业务引用':'已通过'}</span></div></div>`}<div class="workspace"><aside class="folders"><h3>${asset?'资产目录':'用例目录'}</h3><p class="muted">${asset?'目录只用于资产分类':'MSP 需求验收项目'}</p>${['全部用例','订单中心','权限校验'].map(f=>`<button class="${folder===f?'chosen':''}" onclick="setFolder('${f}')">${f==='全部用例'?'▤':'▱'}　${f}</button>`).join('')}<div class="tip" style="margin-top:40px">${asset?'修改资产不会自动覆盖已引用的业务用例。':'执行事实与用例定义分开保存，保留每次执行证据。'}</div></aside><div class="content">${plan?'<div class="tabs"><button class="active">测试用例（6）</button><button onclick="notify(\'缺陷列表沿用现有页面，本原型聚焦用例布局\')">关联缺陷（3）</button><button onclick="notify(\'文档编辑沿用现有能力，刷新不覆盖草稿\')">计划文档</button></div>':''}<div class="filters"><input id="search" aria-label="搜索用例" placeholder="搜索用例编号、名称或标签" value="${esc(query)}"><select id="status" aria-label="筛选执行状态"><option value="">全部执行状态</option>${['成功','失败','未执行'].map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select><button onclick="query='';status='';folder='全部用例';selected.clear();render()">重置</button></div><div id="listing"></div></div></div></section><p class="muted">交互原型：数据只在当前页面内存中变化。正式导出采用异步 XLSX，本页下载 CSV 示例。</p>`;document.querySelector('#search').oninput=e=>{query=e.target.value;selected.clear();listing()};document.querySelector('#status').onchange=e=>{status=e.target.value;selected.clear();listing()};listing()}
function setFolder(f){folder=f;selected.clear();render()}
function listing(){const f=filtered();document.querySelector('#listing').innerHTML=`${selected.size?`<div class="bulk"><strong>已选 ${selected.size} 项</strong><button onclick="batch('level')">修改等级</button><button onclick="batch('category')">修改分类</button><button onclick="batch('tags')">修改标签</button><button onclick="exportRows()">导出</button><button class="danger" onclick="batch('delete')">删除</button><button class="quiet" onclick="selected.clear();listing()">取消选择</button></div>`:'<p class="muted">勾选用例后可批量操作　·　当前为本页选择</p>'}${!f.length?'<div class="empty">没有符合条件的用例<br>调整搜索或筛选条件后重试</div>':`<div class="scroll"><table><thead><tr><th><input type="checkbox" id="all" aria-label="选择本页" ${f.every(r=>selected.has(r.id))?'checked':''}></th><th>编号</th><th>用例名称</th><th>等级</th><th>${view==='asset'?'资产分类':'执行状态'}</th><th>${view==='asset'?'引用项目':'缺陷 / 附件'}</th><th>操作</th></tr></thead><tbody>${f.map(r=>`<tr><td><input type="checkbox" class="pick" aria-label="选择 ${r.id}" data-id="${r.id}" ${selected.has(r.id)?'checked':''}></td><td class="muted">${r.id}</td><td class="name"><button onclick="detail('${r.id}')">${esc(r.name)}</button><div style="margin-top:6px">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></td><td><span class="badge ${r.level==='P0'?'warn':''}">${r.level}</span></td><td>${view==='asset'?esc(r.category):`<span class="badge ${r.status==='成功'?'ok':r.status==='失败'?'bad':''}">${r.status}</span>`}</td><td class="muted">${view==='asset'?r.ref+' 个项目':r.bugs+' 缺陷　 /　'+r.files+' 附件'}</td><td><button class="quiet" onclick="detail('${r.id}')">查看 →</button></td></tr>`).join('')}</tbody></table></div>`}<div class="foot"><span>共 ${f.length} 条　${selected.size?'已选 '+selected.size+' 条':''}</span><div><button disabled>‹</button>　1　<button disabled>›</button>　20 条 / 页</div></div>`;document.querySelectorAll('.pick').forEach(c=>c.onchange=()=>{c.checked?selected.add(c.dataset.id):selected.delete(c.dataset.id);listing()});let all=document.querySelector('#all');if(all){all.indeterminate=selected.size>0&&!f.every(r=>selected.has(r.id));all.onchange=()=>{f.forEach(r=>all.checked?selected.add(r.id):selected.delete(r.id));listing()}}}
function open(id){focusReturn=document.activeElement;document.querySelector(id).classList.add('open');document.querySelector(id+' button').focus()}
function closeOverlays(){document.querySelectorAll('.overlay').forEach(d=>d.classList.remove('open'));focusReturn?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlays();if(e.key==='Tab'){let o=document.querySelector('.overlay.open');if(!o)return;let els=[...o.querySelectorAll('button,input,select')].filter(e=>!e.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
function batch(kind){let items=rows.filter(r=>selected.has(r.id));if(!items.length)return;let names={level:'批量修改等级',category:'批量修改资产分类',tags:'批量修改标签',delete:'确认批量删除'};document.querySelector('#dialogTitle').textContent=names[kind];document.querySelector('#dialogBody').innerHTML=`<p>本次操作已选 <strong>${items.length}</strong> 条用例。</p>${kind==='delete'?`<div class="tip">${items.filter(r=>r.ref).length} 条资产被业务项目引用，将保留。只删除其余可处理项，业务项目副本和执行历史不受影响。</div>`:kind==='tags'?'<label class="field">修改方式<select id="mode"><option value="add">增加标签</option><option value="remove">移除标签</option><option value="replace">替换全部标签</option></select></label><label class="field">标签（逗号分隔）<input id="value" value="回归"></label><p class="muted">替换将覆盖已有标签，请核对所选范围。</p>':`<label class="field">修改为<select id="value">${(kind==='level'?['P0','P1','P2','P3']:['订单中心','权限校验','未分类']).map(v=>`<option>${v}</option>`).join('')}</select></label>`}`;document.querySelector('#confirm').onclick=()=>{let blocked=0;const val=document.querySelector('#value')?.value;if(kind==='tags'&&!val.trim()){notify('请输入标签；原型不支持空标签覆盖');return}items.forEach(r=>{if(kind==='delete'){if(r.ref){blocked++;return}rows=rows.filter(x=>x.id!==r.id)}else if(kind==='tags'){const ts=[...new Set(val.split(/[,，]/).map(t=>t.trim()).filter(Boolean))],m=document.querySelector('#mode').value;r.tags=m==='replace'?ts:m==='remove'?r.tags.filter(t=>!ts.includes(t)):[...new Set([...r.tags,...ts])]}else r[kind]=val});selected.clear();closeOverlays();render();notify(`示例操作：成功 ${items.length-blocked} 项${blocked?'，引用保护跳过 '+blocked+' 项':''}`)};open('#dialog')}
function detail(id){const r=rows.find(r=>r.id===id);document.querySelector('#detailBody').innerHTML=`<span class="badge">TC-${r.id}</span><h2 style="font-size:22px;margin-top:14px">${esc(r.name)}</h2><p class="muted">${r.level}　·　${esc(r.category)}　·　定义版本 v3</p><div class="tabs"><button class="active" id="factsTab">当前执行</button><button id="defTab">用例定义</button></div><div id="detailTab"></div>`;let body=document.querySelector('#detailTab');const facts=()=>{document.querySelector('#factsTab').classList.add('active');document.querySelector('#defTab').classList.remove('active');body.innerHTML=r.status==='未执行'?'<div class="empty">尚无执行记录</div>':`<div class="tip">个人 Agent 提交 · 结构校验通过<br>结果由执行者声明，平台未独立复核业务行为。</div><h3>本次结果 <span class="badge ${r.status==='成功'?'ok':'bad'}">${r.status}</span></h3><p class="muted">绑定定义 v3 · 2026-10-23 14:30<br>3 条执行事实 · 2 个原始步骤</p>${['步骤 1：打开订单页面','步骤 2：提交订单','再次执行步骤 2：确认刷新后的状态'].map((s,i)=>`<div class="fact"><strong>${s}</strong><p class="muted">${i===2?'保留重复执行事实，不覆盖定义':'实际结果：'+(i?'订单状态已更新':'页面已加载')}</p><span class="badge">执行前证据</span> <span class="badge">执行后证据</span></div>`).join('')}<p class="muted">附件 ${r.files}　·　关联缺陷 ${r.bugs}</p>`};document.querySelector('#factsTab').onclick=facts;document.querySelector('#defTab').onclick=()=>{document.querySelector('#defTab').classList.add('active');document.querySelector('#factsTab').classList.remove('active');body.innerHTML='<h3>前置条件</h3><p>账号具备订单访问权限，存在可用库存。</p><div class="fact">1. 打开订单页面<br><span class="muted">预期：展示可操作的订单表单</span></div><div class="fact">2. 提交订单<br><span class="muted">预期：订单创建成功并展示最新状态</span></div><p class="tip">定义共2步；重复执行保留在当前执行区域。</p>'};facts();open('#detail')}
function failure(){document.querySelector('#detailBody').innerHTML='<h2>历史同步失败明细</h2><p class="muted">以下原因用于评审展示，实际根因仍需服务端日志确认。</p>'+['测试项目1','测试1'].map(n=>`<div class="fact"><strong>${n}</strong> <span class="badge bad">目录准备失败</span><p>检测到同名历史目录，尚未建立可信的来源关联。</p><p class="muted">建议：核对来源项目后补齐目录映射，再重试失败项。错误编号可供管理员查询日志。</p></div>`).join('')+'<button onclick="notify(\'原型不提交重试；修复映射后应仅重试失败项\')">重试失败项</button>';open('#detail')}
function refreshPlan(){let b=document.querySelector('#refresh');b.disabled=true;b.textContent='正在获取…';setTimeout(()=>{if(view==='plan'){b.disabled=false;b.textContent='✓ 已获取最新数据';notify('示例刷新完成；正式功能应读取统一执行与同步数据')}},600)}
function exportRows(){const targets=selected.size?rows.filter(r=>selected.has(r.id)):filtered();if(!targets.length){notify('没有可导出的用例');return}const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';let csv='\uFEFF'+[['编号','名称','等级','分类','标签'],...targets.map(r=>[r.id,r.name,r.level,r.category,r.tags.join(';')])].map(r=>r.map(cell).join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='MSP-原型示例.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(`已导出 ${targets.length} 条示例；正式功能使用异步 XLSX`)}
render();
</script></html>
