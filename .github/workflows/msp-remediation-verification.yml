name: MSP Remediation Verification
on:
  workflow_dispatch:
  push:
    branches: ['codex/weekly-remediation-20261028']
permissions:
  contents: read
concurrency:
  group: remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.8.1
          cache: pnpm
          cache-dependency-path: frontend/package.json
      - run: pnpm install --no-frozen-lockfile
        working-directory: frontend
      - run: pnpm run test:selection-toggle && pnpm run test:weekly-remediation-sfc
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build-manifest
          path: frontend/dist/build-manifest.json
          if-no-files-found: ignore
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: quality-test-only
        ports: ['13326:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pquality-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -pl backend/app -am -Dquality.mysql=true -DskipTests=false package
        env:
          MAVEN_OPTS: -Xmx1536m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
