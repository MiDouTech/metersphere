name: MSP Remediation Verification
on:
  workflow_dispatch:
  push:
    branches: ['codex/weekly-remediation-20261028']
permissions:
  contents: read
  actions: read
concurrency:
  group: remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: reuse
        name: Reuse verified unchanged frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=40672471196
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)
          frontend_ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" --jq '[.jobs[] | select(.name == "frontend" and .conclusion == "success")] | length')
          if [ "$frontend_ok" = 1 ] && [ "$(git rev-parse "$source_sha:frontend")" = "$(git rev-parse HEAD:frontend)" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name frontend-static --dir frontend/dist; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "Verified frontend artifact reused from $source_sha" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          version: 8.4.0
      - uses: actions/setup-node@v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          node-version: 20.8.1
          cache: pnpm
          cache-dependency-path: frontend/package.json
      - run: pnpm install --no-frozen-lockfile
        if: steps.reuse.outputs.reused != 'true'
        working-directory: frontend
      - run: pnpm run test:selection-toggle && pnpm run test:weekly-remediation-sfc
        if: steps.reuse.outputs.reused != 'true'
        working-directory: frontend
      - run: pnpm run build
        if: steps.reuse.outputs.reused != 'true'
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-static
          path: frontend/dist/
          retention-days: 1
          if-no-files-found: error
  backend:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: quality-test-only
        ports: ['13326:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pquality-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: frontend/dist
      - name: Build pinned official MinIO test dependency
        run: docker build -t minio/minio:RELEASE.2023-03-13T19-46-17Z -f deploy/quality-verify/Dockerfile.minio-test-source .
      - run: chmod +x mvnw && ./mvnw -B -pl backend/app -am -Dquality.mysql=true -Dapi.version=1.44 -DskipTests=false package
        env:
          MAVEN_OPTS: -Xmx1536m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
