spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.topic-prefix=${KAFKA_TOPIC_PREFIX:metersphere}
kafka.topic.plugin=${kafka.topic-prefix}.PLUGIN
kafka.topic.export=${kafka.topic-prefix}.EXPORT
kafka.topic.api-report=${kafka.topic-prefix}.API_REPORT_TOPIC
kafka.topic.api-report-task=${kafka.topic-prefix}.API_REPORT_TASK_TOPIC
kafka.topic.api-report-debug=${kafka.topic-prefix}.API_REPORT_DEBUG_TOPIC
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:metersphere}
logging.file.path=/opt/metersphere/logs/metersphere
spring.redis.redisson.file=file:/opt/metersphere/conf/redisson.yml
jmeter.home=/opt/jmeter
run.mode=standalone
logger.level=INFO
logger.sql.level=info
